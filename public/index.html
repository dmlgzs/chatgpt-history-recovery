<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>拾光 · 聊天档案</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/vendor/marked.js"></script>
  <script defer src="/vendor/purify.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="会话列表">
      <a class="brand" href="#" aria-label="返回档案概览"><span class="brand-mark">拾</span><span>拾光<small>CHAT ARCHIVE</small></span><span class="brand-dot"></span></a>
      <button class="search-trigger" id="open-search"><span data-icon="search"></span><span>搜索所有聊天记录</span><kbd>Ctrl K</kbd></button>
      <button class="overview-link active" id="home-button"><span data-icon="grid"></span>档案概览<span data-icon="arrow-up-right"></span></button>
      <div class="sidebar-label"><span>我的会话</span><span id="sidebar-count">—</span></div>
      <div class="list-filters" role="group" aria-label="会话筛选"><button data-filter="all" class="active">全部</button><button data-filter="cached">有正文</button><button data-filter="empty">仅标题</button></div>
      <div class="list-tools"><input id="title-filter" type="search" placeholder="筛选会话标题…" aria-label="筛选会话标题"><select id="sort" aria-label="会话排序"><option value="recent">最近更新</option><option value="oldest">最早更新</option><option value="messages">消息最多</option></select></div>
      <div class="conversation-list" id="conversation-list" tabindex="0"><p class="muted list-status">正在读取档案…</p></div>
      <div class="sidebar-footer"><span class="local-dot"></span><span>本地档案 · 离线可读</span><button id="show-report" title="查看恢复报告" aria-label="查看恢复报告"><span data-icon="info"></span></button></div>
    </aside>
    <button class="sidebar-overlay" id="sidebar-overlay" aria-label="关闭侧栏" hidden></button>
    <main class="main-panel">
      <header class="topbar"><div class="breadcrumb"><button class="icon-button mobile-menu" id="mobile-menu" title="打开会话列表" aria-label="打开会话列表"><span data-icon="menu"></span></button><span class="breadcrumb-root">个人档案</span><span class="slash">/</span><span id="breadcrumb-page">概览</span></div><div class="topbar-actions"><span class="local-badge"><span class="local-dot"></span>仅在此设备</span><button class="icon-button" id="theme-toggle" title="切换深浅主题" aria-label="切换深浅主题"><span data-icon="moon"></span></button></div></header>
      <div id="workspace" class="workspace" tabindex="-1"></div>
    </main>
  </div>
  <dialog id="search-dialog" class="search-dialog"><div class="search-bar"><span data-icon="search"></span><input id="global-search" placeholder="在所有消息中寻找…" aria-label="全文搜索" autocomplete="off"><button class="key-button" id="close-search">Esc</button></div><div class="search-subline"><span id="search-status">输入关键词，搜索正文与会话标题</span><label><input type="checkbox" id="search-current">仅当前会话</label></div><div class="search-results" id="search-results"></div></dialog>
  <dialog id="detail-dialog" class="detail-dialog"><div class="dialog-heading"><h2 id="detail-title">详情</h2><button class="icon-button" id="close-detail" title="关闭" aria-label="关闭"><span data-icon="x"></span></button></div><div id="detail-body" class="detail-body"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
